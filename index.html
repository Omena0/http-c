<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #121212;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 3rem;
        }

        h2 {
            margin: 0;
            font-weight: 400;
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <h2>This is being served from a C HTTP server.</h2>
</body>
</html>
